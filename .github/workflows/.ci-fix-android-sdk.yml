name: Apply Android SDK CI fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix Android SDK setup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/build.yml')
          text = path.read_text()
          old = '''      - name: Set up Android SDK\n        uses: android-actions/setup-android@v3\n'''
          new = '''      - name: Set up Android SDK\n        uses: android-actions/setup-android@v3\n        with:\n          packages: platform-tools\n'''
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'Expected exactly 2 Android SDK setup steps, found {count}')
          path.write_text(text.replace(old, new))
          print('Updated exactly two Android SDK setup steps.')
          PY

          if grep -q 'packages: tools' .github/workflows/build.yml; then
            echo 'ERROR: obsolete tools package is still requested.'
            exit 1
          fi

          test "$(grep -c 'packages: platform-tools' .github/workflows/build.yml)" -eq 2

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/build.yml
          git rm .github/workflows/.ci-fix-android-sdk.yml
          git commit -m 'Fix Android SDK setup in CI'
          git push origin HEAD:main
