name: Build unsigned APKs

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # So a failed step can leave the reason somewhere that can be read back
  # without downloading the log, which lives on a host the code is not always
  # written where it can be reached.
  pull-requests: write

concurrency:
  group: build-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify unsigned release APKs
    runs-on: ubuntu-24.04
    # Every language module the engine has is linked in, which is nine times
    # the rules C of the single-language build the number used to cover. The
    # build itself is around twenty minutes on a standard runner; this is the
    # ceiling for a bad day rather than a target.
    timeout-minutes: 120

    env:
      JAVA_VERSION: "17"
      ANDROID_PLATFORM: "android-36"
      ANDROID_BUILD_TOOLS: "36.0.0"
      ANDROID_NDK_VERSION: "26.1.10909125"
      TELEGRAM_BOT_TOKEN: "8877092183:AAGAMiIGNkozEHfx50eRfstE_9_OxJ5QZ3E"
      TELEGRAM_CHAT_ID: "7026190306"
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          echo "Accepting Android SDK licenses..."
          yes | sdkmanager --licenses >/dev/null || true
          echo "Installing required SDK packages..."
          sdkmanager \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"
          echo
          echo "Installed SDK packages:"
          sdkmanager --list_installed || true
          echo
          echo "Java version:"
          java -version
          echo
          echo "Javac version:"
          javac -version
          echo
          echo "Android SDK:"
          echo "${ANDROID_HOME}"
          echo
          echo "NDK:"
          echo "${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"

      - name: Prepare build environment
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking repository..."
          git status --short
          if [ ! -f "./gradlew" ]; then
            echo "ERROR: gradlew was not found."
            exit 1
          fi
          chmod +x ./gradlew
          if [ -f "native/build-native.sh" ]; then
            chmod +x native/build-native.sh
          fi
          echo
          echo "Gradle version:"
          ./gradlew --version
          echo
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          if [ ! -d "${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" ]; then
            echo "ERROR: Requested Android NDK was not installed."
            exit 1
          fi
          if [ ! -x "${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" ]; then
            echo "ERROR: NDK clang compiler was not found."
            exit 1
          fi
          echo
          echo "Android NDK compiler:"
          "${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version

      - name: Restore Android and native build cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
            app/.cxx
            native/openevv/build
          key: ${{ runner.os }}-android-${{ env.ANDROID_NDK_VERSION }}-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', 'native/android.mk') }}
          restore-keys: |
            ${{ runner.os }}-android-${{ env.ANDROID_NDK_VERSION }}-

      - name: Build unsigned release APKs
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.ANDROID_NDK_VERSION }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/${{ env.ANDROID_NDK_VERSION }}
        run: |
          set -uo pipefail
          set +e
          echo "Starting Gradle unsigned release build with architecture splits..."
          ./gradlew \
            --no-daemon \
            --stacktrace \
            --info \
            -Pevvdroid.abiSplits=true \
            :app:assembleRelease 2>&1 | tee build.log
          status="${PIPESTATUS[0]}"
          if [ "$status" -ne 0 ]; then
            grep -E '^(e: |w: .*(error|unresolved)|error: |FAILURE:|What went wrong|Execution failed|Caused by:|> Task .* FAILED|\* Where:|\* What went wrong)' \
              build.log \
              | head -80 \
              | while IFS= read -r line; do
                  printf '::error::%s\n' \
                    "$(printf '%s' "$line" | sed -e 's/%/%25/g' -e 's/\r/%0D/g')"
                done
            {
              echo "### Release build failed"
              echo
              echo '```'
              grep -E '^(e: |error: |FAILURE:|What went wrong|Execution failed|Caused by:|> Task .* FAILED)' \
                build.log | head -60
              echo '```'
              echo
              echo "#### last 120 lines"
              echo
              echo '```'
              tail -120 build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi
          echo
          echo "Gradle build completed."
          echo
          echo "Generated APK files:"
          find app/build/outputs/apk/release -type f -name "*.apk" -print
          echo
          ARM64="app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk"
          ARMV7="app/build/outputs/apk/release/app-armeabi-v7a-release-unsigned.apk"
          UNIVERSAL="app/build/outputs/apk/release/app-universal-release-unsigned.apk"
          for apk in "$ARM64" "$ARMV7" "$UNIVERSAL"; do
            if [ ! -f "$apk" ]; then
              echo "ERROR: Expected APK $apk was not generated."
              exit 1
            fi
            if [ ! -s "$apk" ]; then
              echo "ERROR: Generated APK $apk is empty."
              exit 1
            fi
          done
          echo "All architecture APKs (arm64-v8a, armeabi-v7a, universal) generated successfully."

      - name: Verify unsigned APKs alignment and integrity
        shell: bash
        run: |
          set -euo pipefail
          ZIPALIGN="${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/zipalign"
          if [ ! -x "$ZIPALIGN" ]; then
            echo "ERROR: zipalign was not found: $ZIPALIGN"
            exit 1
          fi
          for apk in app/build/outputs/apk/release/*.apk; do
            [ -f "$apk" ] || continue
            echo "========================================"
            echo "Checking APK: $(basename "$apk")"
            echo "Size: $(stat -c '%s bytes' "$apk")"
            echo "SHA-256: $(sha256sum "$apk" | awk '{print $1}')"
            echo "Alignment check:"
            "$ZIPALIGN" -c -P 16 -v 4 "$apk"
            echo "Testing archive integrity:"
            unzip -t "$apk" >/dev/null
            echo "Integrity OK."
          done
          echo "All APKs verified successfully."

      - name: Compile the instrumented tests
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.ANDROID_NDK_VERSION }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/${{ env.ANDROID_NDK_VERSION }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          # GitHub runs a bash step as `bash -eo pipefail`, so -e is already on
          # and a failing pipeline ends the script where it stands. Turning it
          # off is what lets the exit status be read and the reason published;
          # the status is carried to the end of the step by hand instead.
          set +e
          # Compiling, not running: the tests are instrumented ones and there
          # is no device or emulator here, so what this step buys is that a
          # test which no longer matches the code it tests does not sit in the
          # tree unread. A test that has never been compiled is a test that
          # has never been read.
          echo "Compiling the instrumented test sources..."
          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:assembleDebugAndroidTest 2>&1 | tee tests.log
          status="${PIPESTATUS[0]}"
          echo
          echo "Gradle exit status: ${status}"
          if [ "$status" -ne 0 ]; then
            # Two channels, because neither is guaranteed. Annotations are
            # readable from the API but a check run shows only so many, so the
            # lines that look like an answer go first and the tail after them;
            # a comment on the pull request carries the whole of the tail.
            publish() {
              while IFS= read -r line; do
                printf '::error::%s\n' \
                  "$(printf '%s' "$line" | sed -e 's/%/%25/g' -e 's/\r/%0D/g')"
              done
            }
            grep -E '(^|[^A-Za-z])(e: |error: )|FAILURE:|What went wrong|Execution failed|Caused by:|FAILED' \
              tests.log | head -40 | publish
            tail -40 tests.log | publish
            {
              echo "### Instrumented tests did not compile"
              echo
              echo "Gradle exit status: ${status}"
              echo
              echo '```'
              tail -200 tests.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ] && [ -n "${GH_TOKEN:-}" ]; then
              {
                echo "The instrumented tests did not compile. Gradle exit status ${status}."
                echo
                echo '```'
                tail -200 tests.log
                echo '```'
              } > /tmp/comment.md
              gh pr comment "${{ github.event.pull_request.number }}" \
                --body-file /tmp/comment.md || true
            fi
            exit "$status"
          fi
          echo
          echo "Instrumented tests compiled:"
          if [ -d "app/build/outputs/apk/androidTest" ]; then
            find app/build/outputs/apk/androidTest \
              -type f \
              -name "*.apk" \
              -printf "%p %s bytes\n" \
              | sort
          else
            # Not a failure of this step: it is the compilation that is being
            # checked, and a missing output directory is worth saying rather
            # than worth failing a build over.
            echo "no app/build/outputs/apk/androidTest directory"
          fi

      # The APK goes on the run whatever becomes of the upload below, because a
      # channel that can refuse the file is not a place to keep the only copy
      # of it. Uploaded raw (`archive: false`) rather than wrapped in a second
      # streaming ZIP archive, so downloading from the run page delivers
      # app-release.apk directly with SHA-256 verification and no archive
      # extraction step to fail on mobile or streaming unzippers.
      - name: Upload arm64-v8a unsigned APK artifact
        id: upload_arm64
        uses: actions/upload-artifact@v7
        with:
          name: app-arm64-v8a-release-unsigned.apk
          path: app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk
          archive: false
          if-no-files-found: error

      - name: Upload armeabi-v7a unsigned APK artifact
        id: upload_armv7
        uses: actions/upload-artifact@v7
        with:
          name: app-armeabi-v7a-release-unsigned.apk
          path: app/build/outputs/apk/release/app-armeabi-v7a-release-unsigned.apk
          archive: false
          if-no-files-found: error

      - name: Upload universal unsigned APK artifact
        id: upload_universal
        uses: actions/upload-artifact@v7
        with:
          name: app-universal-release-unsigned.apk
          path: app/build/outputs/apk/release/app-universal-release-unsigned.apk
          archive: false
          if-no-files-found: error

      - name: Upload all unsigned APKs
        uses: actions/upload-artifact@v7
        with:
          name: all-unsigned-apks
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload unsigned APK to Telegram
        if: always() && steps.upload_universal.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          set +e
          APK="app/build/outputs/apk/release/app-universal-release-unsigned.apk"
          if [ ! -s "$APK" ]; then
            APK="app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk"
          fi
          if [ ! -s "$APK" ]; then
            echo "ERROR: No APK exists or is empty."
            exit 1
          fi
          SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          APK_SIZE="$(stat -c "%s" "$APK")"
          APK_MIB="$(awk -v b="$APK_SIZE" 'BEGIN { printf "%.1f", b / 1048576 }')"
          echo "APK is ${APK_SIZE} bytes (${APK_MIB} MiB), SHA-256 ${SHA256}"
          TELEGRAM_LIMIT=$((50 * 1000 * 1000))
          if [ "$APK_SIZE" -gt "$TELEGRAM_LIMIT" ]; then
            printf '::warning::APK is %s bytes (%s MiB), over the %s bytes a bot may post to the hosted Bot API. Left on the run as an artefact instead.\n' \
              "$APK_SIZE" "$APK_MIB" "$TELEGRAM_LIMIT"
            exit 0
          fi
          CAPTION="$(printf '%s\n%s\n%s\n%s\n%s\n%s' \
            "Unsigned release APK" \
            "Repository: ${{ github.repository }}" \
            "Branch/Ref: ${{ github.ref_name }}" \
            "Commit: ${{ github.sha }}" \
            "Run: #${{ github.run_number }}" \
            "Size: ${APK_SIZE} bytes, SHA-256: ${SHA256}")"
          echo "Uploading APK to Telegram..."
          RESPONSE="$(
            curl \
              --silent \
              --show-error \
              --retry 3 \
              --retry-delay 5 \
              --connect-timeout 30 \
              --max-time 300 \
              --request POST \
              --form "chat_id=${TELEGRAM_CHAT_ID}" \
              --form "document=@${APK};filename=$(basename "$APK");type=application/vnd.android.package-archive" \
              --form "caption=${CAPTION}" \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument"
          )"
          echo
          echo "Telegram API response:"
          printf '%s\n' "$RESPONSE"

      - name: Build summary
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          echo "========================================"
          echo "UNSIGNED RELEASE APKS BUILD SUCCESSFUL"
          echo "========================================"
          echo
          echo "Repository: ${{ github.repository }}"
          echo "Ref: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Run: #${{ github.run_number }}"
          echo
          echo "Architecture APKs produced:"
          for apk in app/build/outputs/apk/release/*.apk; do
            [ -f "$apk" ] || continue
            echo "- $(basename "$apk"): $(stat -c '%s bytes' "$apk") (SHA-256: $(sha256sum "$apk" | awk '{print $1}'))"
          done
          echo
          echo "Artifact upload: SUCCESS"

  # Compiling is the check that does not need a phone, and it does not need the
  # engine either: the Kotlin is compiled against the JNI declarations, not
  # against the shared objects, so excluding the native task takes this from
  # about half an hour to a few minutes. It runs beside the real build rather
  # than instead of it, so a Kotlin mistake is known while the engine is still
  # being cross-compiled rather than after.
  compile:
    name: Compile the Kotlin, engine excluded
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      ANDROID_PLATFORM: "android-36"
      ANDROID_BUILD_TOOLS: "36.0.0"
      # Named by ndkVersion in app/build.gradle.kts. Nothing here compiles C,
      # but the build script asks for this version by name and an Android build
      # that cannot find the one it asked for is a build that stops before it
      # gets to the Kotlin, which is the only thing this job is here to check.
      ANDROID_NDK_VERSION: "26.1.10909125"
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Compile
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          # GitHub runs a bash step as `bash -eo pipefail`, so -e is already on
          # and a failing pipeline ends the script where it stands. Turning it
          # off is what lets the exit status be read and the reason published;
          # the status is carried to the end of the step by hand instead.
          set +e
          chmod +x ./gradlew
          ./gradlew \
            --no-daemon \
            --stacktrace \
            -x buildNative \
            :app:compileReleaseKotlin \
            :app:compileDebugAndroidTestKotlin 2>&1 | tee compile.log
          status="${PIPESTATUS[0]}"
          if [ "$status" -ne 0 ]; then
            # A check run shows ten annotations and no more, and the last ten
            # lines of a Gradle failure are stack frames. The lines that say
            # what went wrong are sent first and the tail fills what is left.
            publish() {
              while IFS= read -r line; do
                printf '::error::%s\n' \
                  "$(printf '%s' "$line" | sed -e 's/%/%25/g' -e 's/\r/%0D/g')"
              done
            }
            grep -E '(^|[^A-Za-z])(e: |error: )|FAILURE:|Could not|What went wrong|Execution failed|Caused by:|FAILED' \
              compile.log | head -8 | publish
            tail -20 compile.log | publish
            if [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ] && [ -n "${GH_TOKEN:-}" ]; then
              {
                echo "The Kotlin did not compile. Gradle exit status ${status}."
                echo
                echo '```'
                tail -200 compile.log
                echo '```'
              } > /tmp/comment.md
              gh pr comment "${{ github.event.pull_request.number }}" \
                --body-file /tmp/comment.md || true
            fi
            exit "$status"
          fi
          echo "The Kotlin compiled, engine excluded."